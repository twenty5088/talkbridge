# Linux 上快速跑 TalkBridgeCore 單元測試（TDD 主迴圈）。完整 iOS 流程在 ios.yml。
name: core-tests
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        shell: bash
        run: set -o pipefail; swift test --package-path Packages/TalkBridgeCore 2>&1 | tee core-test.log
      - name: Summary
        if: always()
        run: |
          grep -E "Executed [0-9]+ tests?" core-test.log | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
